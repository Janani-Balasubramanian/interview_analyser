services:
  - type: web
    name: interview-analyzer-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard (paste Neon URL)
      - key: USE_MOCK_AI
        value: "true"
      - key: OPENAI_API_KEY
        value: ""
      - key: FRONTEND_URL
        sync: false          # set manually after Netlify deploy
      - key: PYTHON_VERSION
        value: "3.12.0"
