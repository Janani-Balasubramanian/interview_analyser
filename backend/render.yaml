services:
  - type: web
    name: interview-analyzer-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_L4QNrGVSj6bu@ep-broad-meadow-ayovrrnp.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: USE_MOCK_AI
        value: "true"
      - key: OPENAI_API_KEY
        value: ""
      - key: FRONTEND_URL
        value: ""
